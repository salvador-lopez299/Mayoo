<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>31 días para ti, mi vida 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #d4a373; 
      --secondary: #faedcd; 
      --accent: #bc6c25; 
      --bg: #fefae0; 
      --text: #283618;
      --mexican-pink: #e4007c;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    .hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .heart-bg { position: absolute; color: var(--primary); opacity: 0.3; animation: float 8s linear infinite; }
    @keyframes float { 0% { transform: translateY(105vh) scale(0.5); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

    h1 { font-family: 'Dancing Script', cursive; margin-top: 40px; font-size: 2.3rem; color: var(--accent); padding: 0 15px; }
    .sub-t { font-weight: 600; opacity: 0.7; margin-bottom: 25px; font-size: 0.9rem; }

    .calendar {
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(55px, 1fr));
      gap: 10px; 
      max-width: 500px; 
      width: 90%; 
      margin: 0 auto;
      background: #ffffff; 
      padding: 20px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .day {
      aspect-ratio: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      border-radius: 10px; 
      background: var(--secondary); 
      font-weight: 600;
      cursor: pointer; 
      transition: 0.3s; 
      color: var(--accent); 
      border: 1px solid rgba(212, 163, 115, 0.2);
    }

    .passed { background: #e9edc9; opacity: 0.8; color: #606c38; }
    .active-now { background: white; border: 2.5px solid var(--accent); animation: softPulse 2s infinite; color: var(--accent); }
    @keyframes softPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .locked { opacity: 0.2; cursor: not-allowed; background: #d1d5db; color: #6b7280; }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 2000; padding: 20px;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: 25px; max-width: 350px; width: 100%;
      border-bottom: 8px solid var(--primary);
    }
    .modal-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; display: none; }

    .envelope-container { margin-top: 40px; cursor: pointer; animation: hoverFloat 3s infinite; }
    .envelope-icon { font-size: 3.5rem; color: var(--mexican-pink); }
    @keyframes hoverFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    .pass-input { padding: 12px; width: 80%; border-radius: 12px; border: 1px solid var(--primary); margin-bottom: 15px; outline: none; font-size: 1rem; }
    .close-btn { padding: 12px 30px; border: none; background: var(--accent); color: white; border-radius: 50px; cursor: pointer; font-weight: 700; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="hearts" id="heart-container"></div>
  <h1>✨ 31 dias para Belencita ✨</h1>
  <p class="sub-t">Porque eres tu, mi vida ❤️</p>

  <div class="calendar" id="calendar"></div>

  <div class="envelope-container" onclick="openPasswordModal()">
    <div class="envelope-icon">✉️</div>
    <p style="color: var(--mexican-pink); font-weight: bold; font-size: 0.8rem; margin-top: 5px;">Algo oculto para ti...</p>
  </div>

  <audio id="player"></audio>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="font-family:'Dancing Script'; color:var(--accent); font-size: 2.2rem; margin:0 0 10px 0;"></h2>
      <img id="modal-img" class="modal-img" src="" alt="Momento">
      <p id="modal-text" style="line-height: 1.5; font-size: 1.1rem;"></p>
      <button class="close-btn" onclick="closeModal()">CERRAR</button>
    </div>
  </div>

  <div class="modal" id="password-modal">
    <div class="modal-content" style="border-color: var(--mexican-pink);">
      <h2 style="color: var(--mexican-pink); font-family:'Dancing Script';">¿Me conoces?</h2>
      <p>Ingresa el dato especial:</p>
      <input type="password" id="pass-field" class="pass-input">
      <button class="close-btn" style="background:var(--mexican-pink);" onclick="verifyPassword()">ABRIR</button>
    </div>
  </div>

  <div class="modal" id="secret-modal">
    <div class="modal-content" style="border-color: var(--mexican-pink);">
      <h2 style="color: var(--mexican-pink); font-family:'Dancing Script';">Para mi Belencita</h2>
      <p id="secret-text" style="font-style: italic; line-height: 1.6;"></p>
      <button class="close-btn" style="background:var(--mexican-pink);" onclick="closeSecretModal()">GUARDAR</button>
    </div>
  </div>

<script>
  /******************************************************************
   * SECCIÓN DE CONTROL MANUAL                                      *
   ******************************************************************/
  
  const diaDesbloqueado = 3; // <--- CAMBIA EL DÍA AQUÍ
  const passwordSecreto = "893149"; // <--- CONTRASEÑA DEL SOBRE
  const mensajeSecreto = "Eres lo mejor que me ha pasado. ¡Te amo Belencita!"; 

  const messages = {
    1: "¡Bienvenida a tu mes, puchurrupuchi! ✨ Te quise armar pues ajá, esto porque quiero que cada día de este mes especificamente recuerdes que eres especial ❤️",
    2: "Hoy solo queria decirte que me encantas. ✨ Tu sonrisa es mi parte favorita de cada día, y espero que sonrrias al ver esto jaja🌷",
    3: "Cada canción me habla de ti... y hoy me quedé en esta, pensando en lo mucho que me gustas.💭",
    4: "Eres de esas personas que llegan para cambiarlo todo para mejor. Eres luz pura. 💫",
    5: "Me gusta tu forma de ser, así tal cual, sin filtros. Eres perfecta para mí. 🫶",
    6: "Si tuviera que elegir un lugar favorito en el mundo, sería siempre donde estés tú. 🌍",
    7: "Eres mi persona favorita. Así de simple, así de real. Te quiero muchísimo. 💕",
    8: "Me haces feliz sin que te des cuenta, solo con existir. Que tengas un día increíble hoy. 😌",
    9: "Me encanta hablar contigo de todo. Podría escucharte por horas y nunca me cansaría. 💬",
    10: "Siempre logras sacarme una sonrisa, incluso en los días pesados. Gracias por ser así. 😄",
    11: "Contigo todo es mejor. Las canciones suenan más bonito y los días tienen más color. 💖",
    12: "Por si nadie te lo ha dicho hoy: eres increíble y estoy muy orgulloso de ti. 🌟",
    13: "No sé cómo le haces, pero cada día me gustas un poquito más. Es magia pura. 😳",
    14: "Eres única, Belencita. No hay nadie que se te compare, soy el más suertudo por tenerte. 💫",
    15: "Mañana es un día muy especial para nosotros... ¿Ya estás lista? 👀",
    16: "¡Felices 3 meses, amor! ❤️ 90 días de puras risas y momentos bellos. ¡Vamos por más! 🥂",
    17: "Después de lo de ayer, lo confirmo: eres y seguirás siendo mi parte favorita. 💕",
    18: "Me gusta estar contigo aunque no hagamos nada. Tu sola compañía me da paz. 😌",
    19: "Eres muy importante para mí. Mucho más de lo que alcanzo a decir con palabras. 💌",
    20: "Hoy mi único objetivo es intentar que sonrías al menos una vez. ¿Lo logré? 😄",
    21: "Me gustas incluso en tus días raros. Ahí también te quiero un montón. 😜",
    22: "Eres ese 'algo' que no sabía que necesitaba hasta que llegaste a mi vida. 💖",
    23: "Me encanta presumirte. Le contaría a todo el mundo lo increíble que eres. 😌",
    24: "Hoy desperté con muchísimas ganas de abrazarte y no soltarte. Te extraño mucho. 🤍",
    25: "Contigo todo se siente real y bonito. Es la conexión más linda que he tenido. 💫",
    26: "Gracias por existir, por cruzarte en mi camino y por decidir quedarte aquí conmigo. 🫶",
    27: "¡Faltan solo 4 días para tu cumple! Ya se siente la emoción en el aire. 🎂",
    28: "Me gustas mucho más de lo que alguna vez planeé. Me ganaste por completo. 😳",
    29: "Eres inolvidable. Cada pequeño detalle tuyo se me queda grabado en la mente. 💭",
    30: "¡Mañana es tu gran día! Descansa hoy, porque mañana festejamos con todo. 🎉",
    31: "¡FELIZ CUMPLEAÑOS, AMOR! 🎂💖 El mundo es más lindo porque tú estás en él. ¡Te amo! 🥳"
  };

  /******************************************************************
   * LÓGICA DE FUNCIONAMIENTO                                       *
   ******************************************************************/
  const calendar = document.getElementById("calendar");
  const player = document.getElementById('player');

  function init() {
    for (let i = 1; i <= 31; i++) {
      const day = document.createElement("div");
      day.className = "day";
      day.innerText = i;

      if (i === diaDesbloqueado) {
        day.classList.add("active-now");
        day.onclick = () => openDay(i);
      } else if (i < diaDesbloqueado) {
        day.classList.add("passed");
        day.onclick = () => openDay(i);
      } else {
        day.classList.add("locked");
        day.onclick = () => alert("Awuantala Belencita, es de a uno jaja ❤️");
      }
      calendar.appendChild(day);
    }
    createSparkles();
  }

  function openDay(day) {
    document.getElementById("modal-title").innerText = "Día " + day;
    document.getElementById("modal-text").innerText = messages[day] || "Algo especial para ti... ❤️";
    
    const img = document.getElementById("modal-img");
    img.src = "imagen" + day + ".jpg";
    img.style.display = "block";
    img.onerror = () => img.style.display = "none";

    player.src = "cancion" + day + ".mp3";
    player.play().catch(() => console.log("Audio bloqueado"));
    document.getElementById("modal").style.display = "flex";
  }

  function closeModal() { document.getElementById("modal").style.display = "none"; player.pause(); }
  function openPasswordModal() { document.getElementById("password-modal").style.display = "flex"; }
  function closePasswordModal() { document.getElementById("password-modal").style.display = "none"; }
  function verifyPassword() {
    if(document.getElementById("pass-field").value === passwordSecreto) {
      closePasswordModal();
      document.getElementById("secret-text").innerText = mensajeSecreto;
      document.getElementById("secret-modal").style.display = "flex";
    } else { alert("Se desbloquea el 31/05/2026 o puedes ingresar los 6 números correctos, amor🫶🏼..."); }
  }
  function closeSecretModal() { document.getElementById("secret-modal").style.display = "none"; }

  function createSparkles() {
    const container = document.getElementById('heart-container');
    for (let i = 0; i < 20; i++) {
      const s = document.createElement('div'); s.className = 'heart-bg'; s.innerHTML = '✦'; 
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (Math.random() * 5 + 4) + 's';
      container.appendChild(s);
    }
  }

  window.onload = init;
  window.onclick = (e) => { if (e.target.className === "modal") { closeModal(); closePasswordModal(); closeSecretModal(); } };
</script>
</body>
</html>
